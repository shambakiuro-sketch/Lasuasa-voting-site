const uid = () => {
  // Generate proper UUID v4 format
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
    var r = Math.random() * 16 | 0,
        v = c == 'x' ? r : (r & 0x3 | 0x8);
    return v.toString(16);
  });
};

// ── Level Database Management ──────────────────────────────
let levelDatabasesCache = {}; // Cache for level configs

async function fetchLevelDatabases() {
  try {
    const res = await fetch(`${MASTER_SUPABASE_URL}/rest/v1/level_databases`, {
      headers: { "apikey": MASTER_SUPABASE_KEY }
    });
    const data = await res.json();
    levelDatabasesCache = {};
    (data || []).forEach(row => {
      levelDatabasesCache[row.level] = {
        url: row.supabase_url,
        key: row.supabase_key,
        id: row.id
      };
    });
    return levelDatabasesCache;
  } catch (e) {
    console.error("Error fetching level databases:", e);
    return {};
  }
}

async function saveLevelDatabase(level, url, key) {
  try {
    const existing = await fetch(`${MASTER_SUPABASE_URL}/rest/v1/level_databases?level=eq.${level}`, {
      headers: { "apikey": MASTER_SUPABASE_KEY }
    }).then(r => r.json());
    
    if (existing && existing.length > 0) {
      await fetch(`${MASTER_SUPABASE_URL}/rest/v1/level_databases?id=eq.${existing[0].id}`, {
        method: "PATCH",
        headers: { "apikey": MASTER_SUPABASE_KEY, "Content-Type": "application/json" },
        body: JSON.stringify({ supabase_url: url, supabase_key: key })
      });
    } else {
      await fetch(`${MASTER_SUPABASE_URL}/rest/v1/level_databases`, {
        method: "POST",
        headers: { "apikey": MASTER_SUPABASE_KEY, "Content-Type": "application/json" },
        body: JSON.stringify({ level, supabase_url: url, supabase_key: key })
      });
    }
    await fetchLevelDatabases();
  } catch (e) {
    console.error("Error saving level database:", e);
    throw e;
  }
}

async function removeLevelDatabase(level) {
  try {
    const existing = await fetch(`${MASTER_SUPABASE_URL}/rest/v1/level_databases?level=eq.${level}`, {
      headers: { "apikey": MASTER_SUPABASE_KEY }
    }).then(r => r.json());
    
    if (existing && existing.length > 0) {
      await fetch(`${MASTER_SUPABASE_URL}/rest/v1/level_databases?id=eq.${existing[0].id}`, {
        method: "DELETE",
        headers: { "apikey": MASTER_SUPABASE_KEY }
      });
      await fetchLevelDatabases();
    }
  } catch (e) {
    console.error("Error removing level database:", e);
    throw e;
  }
}

function getLevelDatabase(level) {
  return levelDatabasesCache[level] || null;
}

// Supabase client
// ══════════════════════════════════════════════════════════════════
function createClient(url, key) {
    const base = url.replace(/\/+$/, "");
    const H = { "Content-Type": "application/json", "apikey": key, "Authorization": `Bearer ${key}` };
    const rest = p => `${base}/rest/v1/${p}`;
    async function query(table, params = {}) {
        const qs = Object.entries(params).map(([k, v]) => `${k}=${encodeURIComponent(v)}`).join("&");
        const r = await fetch(`${rest(table)}${qs ? "?" + qs : ""}`, { headers: Object.assign(Object.assign({}, H), { "Prefer": "return=representation" }) });
        if (!r.ok)
            throw new Error(await r.text());
        return r.json();
    }
    async function insert(table, data) {
        const r = await fetch(rest(table), { method: "POST", headers: Object.assign(Object.assign({}, H), { "Prefer": "return=representation" }), body: JSON.stringify(data) });
        if (!r.ok)
            throw new Error(await r.text());
        return r.json();
    }
    async function update(table, match, data) {
        const qs = Object.entries(match).map(([k, v]) => `${k}=eq.${encodeURIComponent(v)}`).join("&");
        const r = await fetch(`${rest(table)}?${qs}`, { method: "PATCH", headers: Object.assign(Object.assign({}, H), { "Prefer": "return=representation" }), body: JSON.stringify(data) });
        if (!r.ok)
            throw new Error(await r.text());
        return r.json();
    }
    async function remove(table, match) {
        const qs = Object.entries(match).map(([k, v]) => `${k}=eq.${encodeURIComponent(v)}`).join("&");
        const r = await fetch(`${rest(table)}?${qs}`, { method: "DELETE", headers: H });
        if (!r.ok)
            throw new Error(await r.text());
    }
    function subscribe(table, cb) {
        const ws_url = `${base.replace("https://", "wss://").replace("http://", "ws://")}/realtime/v1/websocket?vsn=1.0.0&apikey=${key}`;
        let ws, timer;
        function connect() {
            ws = new WebSocket(ws_url);
            ws.onopen = () => ws.send(JSON.stringify({ topic: "realtime:*", event: "phx_join", payload: { config: { broadcast: { self: true }, postgres_changes: [{ event: "*", schema: "public", table }] } }, ref: "1" }));
            ws.onmessage = e => { const m = JSON.parse(e.data); if (m.event === "postgres_changes" || (m.payload && m.payload.data))
                cb(); if (m.event === "heartbeat")
                ws.send(JSON.stringify({ topic: "phoenix", event: "heartbeat", payload: {}, ref: null })); };
            ws.onclose = () => { timer = setTimeout(connect, 3000); };
            ws.onerror = () => ws.close();
        }
        connect();
        return () => { clearTimeout(timer); ws && ws.close(); };
    }
    return { query, insert, update, remove, subscribe };
}

// Function to get level-specific client
function getLevelClient(level) {
  const levelDb = getLevelDatabase(level);
  if (!levelDb) {
    return null;
  }
  return createClient(levelDb.url, levelDb.key);
}

// Fetch votes from all configured level databases
async function fetchAggregatedVotes(posts, candidates) {
  const results = {};
  posts.forEach(p => {
    results[p.id] = {};
    candidates.filter(c => c.post_id === p.id).forEach(c => {
      results[p.id][c.id] = 0;
    });
  });
  
  // Fetch votes from each configured level
  for (const level in levelDatabasesCache) {
    try {
      const client = getLevelClient(level);
      if (!client) continue;
      
      const voters = await client.query("voters", {});
      voters.forEach(v => {
        if (!v.voted || !v.votes) return;
        Object.entries(v.votes).forEach(([pid, cid]) => {
          if (results[pid] && cid) {
            results[pid][cid] = (results[pid][cid] || 0) + 1;
          }
        });
      });
    } catch (e) {
      console.error(`Error fetching votes for level ${level}:`, e);
    }
  }
  
  return results;
}

// Fetch per-level vote breakdowns for detailed results
async function fetchPerLevelVotes(posts, candidates) {
  const perLevel = {};
  
  for (const level in levelDatabasesCache) {
    perLevel[level] = {};
    posts.forEach(p => {
      perLevel[level][p.id] = {};
      candidates.filter(c => c.post_id === p.id).forEach(c => {
        perLevel[level][p.id][c.id] = 0;
      });
    });
    
    try {
      const client = getLevelClient(level);
      if (!client) continue;
      
      const voters = await client.query("voters", {});
      voters.forEach(v => {
        if (!v.voted || !v.votes) return;
        Object.entries(v.votes).forEach(([pid, cid]) => {
          if (perLevel[level][pid] && cid) {
            perLevel[level][pid][cid] = (perLevel[level][pid][cid] || 0) + 1;
          }
        });
      });
    } catch (e) {
      console.error(`Error fetching per-level votes for level ${level}:`, e);
    }
  }
  
  return perLevel;
}
